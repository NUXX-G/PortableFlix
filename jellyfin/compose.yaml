services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: portablelab
    user: "1000:1000"
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /srv/media/transcodes:/cache/transcodes
      - /srv/media/test:/media/test:ro
      - /mnt/nas:/nas:ro,rslave
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped
